<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <style>
    text{font-family:Arial,sans-serif;fill:#e8fbff}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#9fc5ce}.label{font-size:25px;font-weight:700}.note{font-size:16px;fill:#c1dce1}.bad{fill:#ffbb7a}.good{fill:#73e5c2}.card{fill:#0d2931;stroke:#32616b;stroke-width:2}.floor{stroke:#5d9aa5;stroke-width:3}.person{stroke:#e8fbff;stroke-width:10;stroke-linecap:round;fill:none}.camera{fill:#70e2e6;stroke:#b8fbff;stroke-width:3}.ray{stroke:#70e2e6;stroke-width:2;stroke-dasharray:7 7;opacity:.75}.angle{stroke:#ffcf70;stroke-width:3;fill:none}.warn{fill:#ffcf70}
  </style>
  <rect width="1600" height="920" fill="#06161b"/>
  <text x="60" y="65" class="title">Squat filming taxonomy: camera position and viewpoint</text>
  <text x="60" y="96" class="sub">V1 is the qualified scoring view. Keep a fixed, portrait phone position after alignment.</text>
  <!-- V0 -->
  <g transform="translate(55 145)"><rect class="card" width="290" height="620" rx="20"/><text x="25" y="48" class="label">V0 — frontal</text><text x="25" y="75" class="note">Reject for squat scoring</text><line class="floor" x1="20" y1="525" x2="270" y2="525"/><rect class="camera" x="120" y="465" width="48" height="32" rx="5"/><circle class="camera" cx="144" cy="481" r="8" fill="#06161b"/><line class="ray" x1="144" y1="465" x2="90" y2="165"/><line class="ray" x1="144" y1="465" x2="198" y2="165"/><circle class="person" cx="144" cy="205" r="25"/><path class="person" d="M144 230V360M95 270H193M144 360L100 480M144 360L188 480"/><text x="25" y="570" class="warn">Knee flexion hidden</text><text x="25" y="595" class="note">Too symmetrical / flat</text></g>
  <!-- V1 -->
  <g transform="translate(365 145)"><rect class="card" width="290" height="620" rx="20" stroke="#73e5c2" stroke-width="4"/><text x="25" y="48" class="label good">V1 — slight off-frontal</text><text x="25" y="75" class="note">Qualified scoring view</text><line class="floor" x1="20" y1="525" x2="270" y2="525"/><rect class="camera" x="42" y="465" width="48" height="32" rx="5"/><circle class="camera" cx="66" cy="481" r="8" fill="#06161b"/><line class="ray" x1="66" y1="465" x2="150" y2="165"/><line class="ray" x1="66" y1="465" x2="230" y2="165"/><circle class="person" cx="164" cy="205" r="25"/><path class="person" d="M164 230L158 360M119 274L197 265M158 360L114 480M158 360L207 480"/><path class="angle" d="M90 500 A70 70 0 0 1 125 450"/><text x="115" y="500" class="note">15–30°</text><text x="25" y="570" class="good">2–3 m • lens near hip height</text><text x="25" y="595" class="note">Shows sagittal knee flexion</text></g>
  <!-- V2 -->
  <g transform="translate(675 145)"><rect class="card" width="290" height="620" rx="20"/><text x="25" y="48" class="label">V2 — profile</text><text x="25" y="75" class="note">Diagnostic / reference only</text><line class="floor" x1="20" y1="525" x2="270" y2="525"/><rect class="camera" x="42" y="465" width="48" height="32" rx="5"/><circle class="camera" cx="66" cy="481" r="8" fill="#06161b"/><line class="ray" x1="66" y1="465" x2="185" y2="165"/><circle class="person" cx="177" cy="205" r="25"/><path class="person" d="M177 230L164 360M163 270L203 290M164 360L115 480M164 360L215 480"/><path class="angle" d="M90 500 A90 90 0 0 1 160 415"/><text x="115" y="493" class="note">90°</text><text x="25" y="570" class="note">Good sagittal diagnosis</text><text x="25" y="595" class="warn">Does not match V1 rulebook</text></g>
  <!-- V3 -->
  <g transform="translate(985 145)"><rect class="card" width="290" height="620" rx="20"/><text x="25" y="48" class="label">V3 — high / low</text><text x="25" y="75" class="note">Reject: perspective distortion</text><line class="floor" x1="20" y1="525" x2="270" y2="525"/><rect class="camera" x="42" y="115" width="48" height="32" rx="5"/><circle class="camera" cx="66" cy="131" r="8" fill="#06161b"/><line class="ray" x1="66" y1="147" x2="206" y2="490"/><circle class="person" cx="175" cy="245" r="25"/><path class="person" d="M175 270V390M125 310H225M175 390L135 480M175 390L215 480"/><text x="25" y="570" class="warn">No above-chest camera</text><text x="25" y="595" class="note">No below-knee camera</text></g>
  <!-- V4 -->
  <g transform="translate(1295 145)"><rect class="card" width="250" height="620" rx="20"/><text x="25" y="48" class="label">V4 — cropped</text><text x="25" y="75" class="note">Reject: unstable joints</text><rect x="50" y="140" width="150" height="360" rx="12" fill="#041014" stroke="#70e2e6" stroke-width="3"/><circle class="person" cx="125" cy="165" r="34"/><path class="person" d="M125 200V390M55 250H195M125 390L50 540M125 390L200 540"/><path d="M47 495h156" stroke="#ffbb7a" stroke-width="8"/><text x="25" y="570" class="warn">Body touches frame edge</text><text x="25" y="595" class="note">Full body required: 60–80%</text></g>
  <text x="60" y="840" class="label good">V1 acceptance target</text><text x="60" y="873" class="sub">Full body, 3% edge clearance, mid-hip centered ±10%, fixed portrait phone, even light, and a stable floor-level setup.</text>
</svg>
